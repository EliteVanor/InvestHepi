# Price & big-move email alerts. No AI involved, so it's cheap to run often.
# Every 20 min, Mon-Fri 13:00-21:59 UTC (covers 9:30-16:00 ET in summer and winter).
# Private repos get 2,000 free Action minutes/month; this uses ~600.
# Want faster? Point a free cron-job.org job at /api/alerts/check with the same Bearer header.
name: Price alerts

on:
  schedule:
    - cron: "5,25,45 13-21 * * 1-5"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check alerts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set; skipping."; exit 0; fi
          curl -fsS -m 60 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/alerts/check" || echo "check failed"
