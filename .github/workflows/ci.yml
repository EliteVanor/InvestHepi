# Offline checks on every push and pull request: types, all test suites, and the production build
# with and without the sign-in (AUTH_*) settings. No secrets, no network calls to real services.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # Node 22 is what the suites were verified on; package.json sets no engines.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build without AUTH_* (single-user mode)
        run: npm run build
      - name: Build with dummy AUTH_* (multi-user mode)
        run: npm run build
        env:
          AUTH_SECRET: ci-dummy-secret-not-real
          AUTH_GOOGLE_ID: ci-dummy-id
          AUTH_GOOGLE_SECRET: ci-dummy-secret
