# Free scheduler: Vercel's free plan only allows one cron per day, so GitHub Actions
# pings the app several times a day. Needs repo secrets APP_URL and CRON_SECRET.
name: Refresh briefings

on:
  schedule:
    # Times are UTC. Weekdays: pre-market x2, midday, after close. Sunday evening: week-ahead.
    - cron: "50 11 * * 1-5"   # ~6:50 ET (winter) / 7:50 ET (summer)
    - cron: "10 13 * * 1-5"   # ~8:10 / 9:10 ET, last run before the open (this is the graded call)
    - cron: "20 17 * * 1-5"   # midday
    - cron: "25 21 * * 1-5"   # after the close
    - cron: "35 22 * * 0"     # Sunday evening
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh each section
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set APP_URL and CRON_SECRET repo secrets to enable scheduled refreshes."; exit 0
          fi
          for s in interests world us; do
            echo "== $s"
            curl -fsS -m 290 --retry 2 --retry-delay 20 \
              -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/refresh?section=$s" || echo "refresh $s failed"
            echo
            sleep 20  # stay under free LLM per-minute limits
          done
